<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kudumbasree Game Nights</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #10091f;
            color: white;
            overflow: hidden;
        }

        /* -------------------------
           SHARED SCREEN STYLES
        -------------------------- */

        .screen {
            position: absolute;
            inset: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                opacity 0.65s ease,
                transform 0.65s ease;

            overflow: hidden;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-40px) scale(0.96);
        }


        /* -------------------------
           BACKGROUND
        -------------------------- */

        .background {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 86, 180, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(90, 140, 255, 0.25),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #120821,
                    #18103a,
                    #08182e
                );

            z-index: -3;
        }

        .glow {
            position: absolute;
            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(169, 92, 255, 0.18);
            filter: blur(90px);

            animation: glowMove 8s ease-in-out infinite alternate;

            z-index: -2;
        }

        @keyframes glowMove {
            from {
                transform: translate(-200px, -150px);
            }

            to {
                transform: translate(350px, 180px);
            }
        }


        /* -------------------------
           FLOATING ICONS
        -------------------------- */

        .floating-icon {
            position: absolute;

            font-size: clamp(2rem, 5vw, 4.5rem);

            opacity: 0.35;

            user-select: none;

            animation: float 6s ease-in-out infinite;
        }

        .icon1 {
            left: 8%;
            top: 18%;
            animation-delay: 0s;
        }

        .icon2 {
            right: 10%;
            top: 15%;
            animation-delay: -2s;
        }

        .icon3 {
            left: 13%;
            bottom: 15%;
            animation-delay: -4s;
        }

        .icon4 {
            right: 14%;
            bottom: 14%;
            animation-delay: -1s;
        }

        .icon5 {
            left: 45%;
            top: 7%;
            animation-delay: -3s;
        }

        .icon6 {
            right: 35%;
            bottom: 7%;
            animation-delay: -5s;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-25px) rotate(5deg);
            }
        }


        /* -------------------------
           LANDING CONTENT
        -------------------------- */

        .welcome-content {
            text-align: center;
            padding: 30px;
            z-index: 2;

            animation: appear 1s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .eyebrow {
            font-size: 0.85rem;
            letter-spacing: 0.45em;

            margin-bottom: 15px;

            opacity: 0.65;
        }

        h1 {
            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 0.9;

            text-transform: uppercase;
            letter-spacing: -0.05em;

            text-shadow:
                0 0 25px rgba(255,255,255,0.15),
                0 0 60px rgba(184, 89, 255, 0.3);
        }

        .game-night {
            display: block;

            margin-top: 15px;

            font-size: clamp(1.5rem, 4vw, 3.2rem);

            letter-spacing: 0.18em;

            color: #ff8ed8;
        }

        .footnote {
            margin-top: 18px;

            font-size: 0.9rem;
            font-style: italic;

            opacity: 0.55;
        }


        /* -------------------------
           BUTTON
        -------------------------- */

        .main-button {
            margin-top: 45px;

            padding: 16px 32px;

            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 999px;

            background: rgba(255,255,255,0.08);
            color: white;

            backdrop-filter: blur(10px);

            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.15em;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .main-button:hover {
            transform: translateY(-4px) scale(1.03);

            background: #ffffff;
            color: #150b2a;

            box-shadow:
                0 12px 40px rgba(255,255,255,0.18);
        }

        .arrow {
            display: inline-block;

            margin-left: 8px;

            transition: transform 0.25s ease;
        }

        .main-button:hover .arrow {
            transform: translateX(5px);
        }


        /* -------------------------
           NAME PAGE
        -------------------------- */

        #nameScreen {
            background:
                radial-gradient(
                    circle at center,
                    #25114c,
                    #10091f 70%
                );
        }

        .name-content {
            width: min(600px, 90%);
            text-align: center;
        }

        .small-title {
            text-transform: uppercase;
            letter-spacing: 0.3em;

            font-size: 0.8rem;

            opacity: 0.55;

            margin-bottom: 15px;
        }

        .name-content h2 {
            font-size: clamp(2.4rem, 7vw, 5rem);

            margin-bottom: 35px;
        }

        .name-input {
            width: 100%;

            padding: 18px 22px;

            border-radius: 15px;

            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 1.15rem;

            outline: none;

            transition:
                border 0.25s ease,
                background 0.25s ease;
        }

        .name-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .name-input:focus {
            border-color: #ff8ed8;
            background: rgba(255,255,255,0.12);
        }


        /* -------------------------
           MOBILE
        -------------------------- */

        @media (max-width: 600px) {

            .floating-icon {
                opacity: 0.2;
            }

            .eyebrow {
                letter-spacing: 0.3em;
            }

            .main-button {
                margin-top: 35px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         SCREEN 1: WELCOME
    ========================== -->

    <section class="screen" id="welcomeScreen">

        <div class="background"></div>
        <div class="glow"></div>

        <!-- Gaming / friendship decorations -->

        <div class="floating-icon icon1">🎮</div>
        <div class="floating-icon icon2">🎲</div>
        <div class="floating-icon icon3">👾</div>
        <div class="floating-icon icon4">🃏</div>
        <div class="floating-icon icon5">💬</div>
        <div class="floating-icon icon6">🫶</div>


        <div class="welcome-content">

            <p class="eyebrow">
                WELCOME TO
            </p>

            <h1>
                Kudumbasree*

                <span class="game-night">
                    GAME NIGHTS
                </span>
            </h1>

            <p class="footnote">
                *prev known as Kulamthondal
            </p>


            <button
                class="main-button"
                onclick="showNamePage()"
            >
                FIND OUT MORE

                <span class="arrow">
                    →
                </span>
            </button>

        </div>

    </section>


    <!-- =========================
         SCREEN 2: NAME
    ========================== -->

    <section
        class="screen hidden"
        id="nameScreen"
    >

        <div class="name-content">

            <p class="small-title">
                FIRST THINGS FIRST
            </p>

            <h2>
                Who are you? 👀
            </h2>

            <input
                class="name-input"
                id="nameInput"
                type="text"
                placeholder="Enter your name..."
                autocomplete="off"
            >

            <button class="main-button">
                CONTINUE
                <span class="arrow">→</span>
            </button>

        </div>

    </section>


    <script>

        function showNamePage() {

            const welcome =
                document.getElementById("welcomeScreen");

            const name =
                document.getElementById("nameScreen");


            // Animate welcome screen away
            welcome.classList.add("hidden");


            // Reveal name page
            setTimeout(() => {

                name.classList.remove("hidden");

                document
                    .getElementById("nameInput")
                    .focus();

            }, 300);

        }

    </script>

</body>
</html>
